<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Information Management — CoP Hub HK</title>
<style>
  :root{
    color-scheme:dark;
    /* Blue/cyan accents connect the dark workspace and the light reading pane. */
    --page:#05090f;
    --bg:#05090f;
    --bg-2:#0b1220;
    --panel:#161d28;
    --panel-sub:#232b37;
    --rail:#242a34;
    --dlg-head:#142438;
    --dlg-left:#213449;
    --dlg-right:#dce8f2;
    --text:#f1f5fb;
    --txt:#f1f5fb;
    --txt-2:#d7dfea;
    --muted:#a4b0c2;
    --faint:#808ea1;
    --dim:#68758a;
    --line:rgba(150,180,220,.16);
    --line-soft:rgba(150,180,220,.09);
    --edge:rgba(150,185,235,.28);
    --accent:#6fa2f4;
    --accent-2:#4aa7b3;
    --accent-3:#8a7bf0;
    --hover:#2b323d;
    --sel:#33445f;
    --sans:ui-sans-serif, system-ui, "Segoe UI", sans-serif;
    --mono:ui-monospace, "Cascadia Mono", "Consolas", "Roboto Mono", monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;min-height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    font-size:15px;line-height:1.5;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  button:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{
    outline:2px solid var(--accent);outline-offset:2px;
  }
  svg{display:block}

  /* ---------------------------------------------------------------- shell */
  /* No top bar at all: the shell starts at y=0 (no dead strip above the rail). */
  .shell{display:flex;height:100vh;min-height:0;overflow:hidden}
  .icon-btn{
    display:inline-flex;align-items:center;justify-content:center;
    width:32px;height:32px;border-radius:9px;color:var(--muted);
    transition:background .12s ease,color .12s ease;
  }
  .icon-btn:hover{background:#2b323d;color:var(--text)}
  .icon-btn:active{background:#38404c}

  .workspace{flex:1 1 auto;display:flex;min-height:0;min-width:0}

  /* ---------------------------------------------------------------- rail */
  .rail{
    flex:0 0 240px;width:240px;min-width:0;
    display:flex;flex-direction:column;gap:4px;
    padding:8px 8px 10px;
    background:#242a34;
    border-right:1px solid #333b47;
    border-radius:0 10px 0 0;
    overflow:hidden;
  }
  .rail-btn{
    display:flex;align-items:center;gap:9px;
    height:36px;width:100%;padding:0 11px;border-radius:999px;
    font-size:14px;color:var(--txt-2);text-align:left;
    transition:background .12s ease,border-color .12s ease,color .12s ease;
  }
  .rail-btn .ico{flex:0 0 auto;color:inherit;opacity:.85}
  .rail-new{border:1px solid #3a4450;background:#2b323d;color:var(--txt)}
  .rail-new:hover{background:#333b47;border-color:#465162}
  .rail-new:active{background:#38404c}
  .rail-lib{color:var(--muted)}
  .rail-lib:hover{background:#2e3742;color:var(--txt)}
  .rail-lib.is-active{background:#33445f;color:#f5f9ff;font-weight:500}
  .rail-lib.is-active .ico{color:#a8c4ff;opacity:1}
  .rail-sep{height:1px;background:var(--line-soft);margin:8px 4px 2px}
  .rail-empty{margin:0;padding:6px 11px;font-size:11.5px;color:var(--faint)}

  /* ---------------------------------------------------------------- stage */
  /* Near-black stage lit by a slow blue/cyan/teal/violet aurora; the glow sits
     behind the copy and stops moving under prefers-reduced-motion. */
  .stage{
    position:relative;isolation:isolate;
    flex:1 1 auto;min-width:0;min-height:0;
    display:flex;align-items:center;justify-content:center;
    padding:16px 26px 22px;
    overflow:hidden;
    background:#05090f;
  }
  /* Two counter-drifting ribbon layers: teal/cyan under violet/indigo. Both sit
     behind the copy and are fixed (not animated) under reduced motion. */
  .stage::before,.stage::after{
    content:"";position:absolute;z-index:-1;pointer-events:none;inset:-30%;
  }
  .stage::before{
    background:
      radial-gradient(46% 15% at 38% 42%, rgba(52,200,212,.40), rgba(52,200,212,0) 72%),
      radial-gradient(24% 7% at 46% 40%, rgba(150,240,244,.26), rgba(150,240,244,0) 70%),
      radial-gradient(52% 16% at 62% 62%, rgba(56,148,238,.30), rgba(56,148,238,0) 74%),
      radial-gradient(40% 14% at 30% 74%, rgba(40,172,152,.26), rgba(40,172,152,0) 72%);
    filter:blur(46px);opacity:.8;
    animation:aurora-cyan 46s ease-in-out infinite alternate;
  }
  .stage::after{
    background:
      radial-gradient(44% 14% at 66% 34%, rgba(128,98,232,.30), rgba(128,98,232,0) 72%),
      radial-gradient(50% 16% at 40% 70%, rgba(96,112,240,.24), rgba(96,112,240,0) 74%),
      radial-gradient(34% 12% at 76% 76%, rgba(152,112,238,.20), rgba(152,112,238,0) 72%);
    filter:blur(54px);opacity:.68;
    animation:aurora-violet 62s ease-in-out infinite alternate;
  }
  @keyframes aurora-cyan{
    0%{transform:rotate(-13deg) translate3d(-3%,2%,0) scale(1.02);opacity:.58}
    50%{opacity:.80}
    100%{transform:rotate(-9deg) translate3d(3%,-2.4%,0) scale(1.09);opacity:.70}
  }
  @keyframes aurora-violet{
    0%{transform:rotate(11deg) translate3d(2%,-2%,0) scale(1.06);opacity:.46}
    50%{opacity:.68}
    100%{transform:rotate(15deg) translate3d(-2.4%,2%,0) scale(1);opacity:.58}
  }
  @media (prefers-reduced-motion: reduce){
    .stage::before,.stage::after{animation:none}
    .stage::before{opacity:.72}
    .stage::after{opacity:.6}
  }
  .stage-inner{
    position:relative;z-index:1;
    width:100%;max-width:600px;min-width:0;
    display:flex;flex-direction:column;align-items:center;
  }
  .greet{
    margin:0;font-size:clamp(26px,5.2vw,42px);line-height:1.06;font-weight:500;letter-spacing:-.02em;
    color:#f1f5fb;text-align:center;
  }
  .lede{
    margin:12px auto 0;max-width:470px;text-align:center;text-wrap:balance;
    font-size:13.5px;line-height:1.6;color:#b6c4d8;
  }

  /* Composer: field on top, one toolbar row underneath; flat panel, flat border. */
  .composer{
    width:100%;margin-top:22px;
    display:flex;flex-direction:column;gap:8px;
    padding:10px;border:1px solid #333b47;border-radius:12px;
    background:#121a26;
    transition:border-color .12s ease;
  }
  .composer:focus-within{border-color:#4c6a99}
  .composer textarea{
    display:block;width:100%;min-height:34px;max-height:150px;resize:none;
    background:transparent;border:0;padding:4px;margin:0;
    color:var(--txt);font:inherit;font-size:13.5px;line-height:1.5;
  }
  .composer textarea::placeholder{color:#9fb2c9;opacity:1}
  .composer textarea:focus{outline:none}
  .composer-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .composer-left{display:flex;align-items:center;gap:4px;min-width:0}
  .composer-right{display:flex;align-items:center;gap:6px;flex:0 0 auto}
  .tool{
    display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 7px;
    border-radius:7px;font-size:12.5px;color:#a9bad0;white-space:nowrap;
    transition:background .12s ease,color .12s ease;
  }
  .tool:hover{background:#1d2632;color:#eef4ff}
  .tool.is-dim{color:#6f7f95}
  .tool.is-dim:hover{background:#1d2632;color:#9fb2c9}
  .tool .ico{flex:0 0 auto}
  #scope-all{max-width:clamp(100px,24vw,240px)}
  #scope-label{min-width:0;overflow:hidden;text-overflow:ellipsis}
  .scope-chevron{flex:0 0 auto;transition:transform .12s ease}
  #scope-all[aria-expanded="true"]{background:#253247;color:#e5efff}
  #scope-all[aria-expanded="true"] .scope-chevron{transform:rotate(180deg)}
  .title-picker{
    position:fixed;z-index:30;display:flex;flex-direction:column;
    width:min(350px,calc(100vw - 24px));padding:6px;
    border:1px solid #3b4a60;border-radius:12px;background:#182230;
    box-shadow:0 12px 32px rgba(0,0,0,.45);overflow:hidden;
  }
  .title-picker label{padding:4px 7px 6px;color:#a9bdd7;font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
  .title-picker input{
    flex:0 0 auto;width:100%;height:30px;padding:0 9px;margin-bottom:5px;
    border:1px solid #36465d;border-radius:7px;background:#101824;
    color:var(--txt);font:inherit;font-size:12px;
  }
  .title-picker input::placeholder{color:#8c9fb9}
  .title-options{min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#536781 transparent}
  .title-option{
    display:flex;align-items:center;gap:9px;width:100%;padding:7px 8px;
    border-radius:6px;text-align:left;color:#d4dfed;font-size:12px;line-height:1.4;
  }
  .title-option+.title-option{border-top:1px solid rgba(150,180,220,.08)}
  .title-option:hover,.title-option:focus-visible{background:#26364c}
  .title-option[aria-selected="true"]{background:#2b3d47;color:#edf7ff;box-shadow:inset 2px 0 var(--accent-2)}
  .title-option .check{flex:0 0 12px;color:#7cc9d2;visibility:hidden}
  .title-option[aria-selected="true"] .check{visibility:visible}
  .title-option .col{min-width:0;flex:1;overflow-wrap:anywhere}
  .title-option .n{flex:0 0 auto;min-width:24px;text-align:right;font-size:11px;color:#93a9c5;font-variant-numeric:tabular-nums}
  .title-option[aria-selected="true"] .n{color:#cfeff2}
  .title-picker .empty{padding:16px 8px;color:#a9bdd7}
  .send{
    display:inline-flex;align-items:center;justify-content:center;
    width:30px;height:30px;border-radius:8px;
    background:#3f6fd6;color:#fff;
    border:1px solid #4f7fe0;
    transition:background .12s ease,border-color .12s ease;
  }
  .send:hover{background:#4a7ce4;border-color:#5c8bea}
  .send:active{background:#3560bd;border-color:#3f6fd6}

  .chips{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:10px}
  .chip{
    height:26px;padding:0 11px;border-radius:999px;
    border:1px solid #333b47;background:#161f2b;
    font-size:11.5px;color:#b3c4dc;
    transition:background .12s ease,color .12s ease,border-color .12s ease;
  }
  .chip:hover{background:#1e2836;color:#eef4ff;border-color:#3f4b5c}
  .chip:active{background:#28364a}

  .footnote{
    margin:8px 0 0;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;
    gap:3px 8px;font-size:11.5px;color:#8d9cb2;text-align:center;
  }
  .footnote .settings{
    display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 5px;border-radius:6px;
    font-size:11.5px;color:#8d9cb2;
  }
  .footnote .settings:hover{background:#232c38;color:#c9d8ec}

  /* ---------------------------------------------------------------- dialog */
  /* A flat caption bar separates the catalogue from the workspace background. */
  .scrim{
    position:fixed;inset:0;z-index:40;background:rgba(2,6,12,.72);
    opacity:1;transition:opacity .16s ease;
  }
  .dialog{
    position:fixed;z-index:50;left:50%;top:50%;transform:translate(-50%,-50%);
    width:min(1180px,94vw);height:min(88vh,900px);max-height:min(88vh,900px);
    display:flex;flex-direction:column;overflow:hidden;
    background:var(--dlg-right);border:1px solid rgba(105,132,157,.34);border-radius:12px;
    background-clip:padding-box;
    box-shadow:0 22px 56px rgba(0,0,0,.55);
  }
  [hidden]{display:none !important}
  .dlg-head{
    flex:0 0 auto;padding:14px 16px 12px;border-bottom:1px solid rgba(148,163,184,.2);
    position:relative;background:var(--dlg-head);
  }
  /* The small caption label stays separate from the sentence-case document titles. */
  .dlg-title{
    margin:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:0 10px;
    padding-right:34px;line-height:1.2;
  }
  .dlg-title .name{
    font-family:var(--sans);font-size:13px;font-weight:600;letter-spacing:.08em;
    text-transform:uppercase;color:#e1eff9;
  }
  .dlg-title .count{
    font-family:var(--sans);font-size:11px;font-weight:400;letter-spacing:.01em;
    color:#a9c3d9;font-variant-numeric:tabular-nums;
    border-left:1px solid rgba(126,184,215,.26);padding-left:10px;
  }
  .dlg-close{position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:7px;color:var(--muted)}
  .dlg-close:hover{background:rgba(102,177,207,.16);color:#eaf8ff}
  .search{position:relative;margin-top:9px}
  .search .ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#91afc6;pointer-events:none}
  .search input{
    width:100%;height:30px;padding:0 10px 0 31px;border-radius:8px;
    background:rgba(8,20,33,.68);border:1px solid rgba(126,171,204,.28);color:var(--txt);
    font:inherit;font-size:12.5px;
    box-shadow:inset 0 1px 3px rgba(0,0,0,.12);
    transition:border-color .12s ease,box-shadow .12s ease,background .12s ease;
  }
  .search input::placeholder{color:#91a9c0}
  .search input:focus{outline:none;border-color:#69b2cf;background:#102539;box-shadow:0 0 0 2px rgba(90,181,208,.14),inset 0 1px 3px rgba(0,0,0,.1)}

  .dlg-body{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:246px minmax(0,1fr)}
  .cats{
    min-width:0;min-height:0;overflow-y:auto;overflow-x:hidden;
    padding:10px 8px 12px;border-right:1px solid rgba(105,157,189,.24);
    background:
      radial-gradient(ellipse at 0% 0%,rgba(96,126,193,.15),transparent 55%),
      linear-gradient(165deg,var(--dlg-left),#1c303f 62%,#192b38);
    scrollbar-width:thin;
    scrollbar-color:rgba(150,175,205,.45) transparent;
  }
  .cats h4{
    margin:0;padding:6px 8px 5px;font-size:10px;font-weight:600;letter-spacing:.14em;
    text-transform:uppercase;color:#9fc9df;
  }
  .cat-group{display:flex;flex-direction:column;gap:1px;padding-bottom:8px}
  .cat{
    position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;
    width:100%;padding:5px 8px;border:1px solid transparent;border-radius:7px;
    font-size:12.5px;text-align:left;color:#c2cddb;
    transition:background .12s ease,color .12s ease,border-color .12s ease;
  }
  .cat span:first-child{min-width:0;overflow-wrap:anywhere}
  .cat .n{flex:0 0 auto;min-width:30px;text-align:right;font-size:11px;color:#9bb3cb;font-variant-numeric:tabular-nums}
  .cat:hover{background:rgba(118,173,212,.12);color:#f2f7ff}
  .cat.is-sel{
    background:linear-gradient(105deg,rgba(88,140,214,.3),rgba(74,122,183,.15));
    border-color:rgba(119,174,226,.4);color:#fff;font-weight:600;
    box-shadow:inset 0 1px rgba(191,219,255,.08);
  }
  .cat.is-sel .n{color:#dbeaff}
  .cat.is-bar.is-sel{
    background:linear-gradient(105deg,rgba(64,159,177,.27),rgba(56,115,139,.14));
    border-color:rgba(99,184,197,.34);
  }
  .cat.is-bar.is-sel .n{color:#cfeff2}
  .cat.is-bar::before{
    content:"";position:absolute;left:0;top:5px;bottom:5px;width:2px;border-radius:2px;
    background:#74cbd3;box-shadow:0 0 9px rgba(93,202,212,.22);
  }

  .list{
    min-width:0;min-height:0;overflow-y:auto;overflow-x:hidden;
    padding:10px 12px 14px;color:#17324a;
    background:
      radial-gradient(ellipse at 100% 0%,rgba(92,173,184,.13),transparent 62%),
      radial-gradient(ellipse at 0% 100%,rgba(120,137,180,.1),transparent 62%),
      linear-gradient(135deg,#e1ebf3,#d5e4ee 56%,#dcebec);
    scrollbar-width:thin;
    scrollbar-color:rgba(64,111,140,.42) transparent;
  }
  /* Scrollbars: the category rail keeps the dark pane treatment, the light
     results pane gets a blue-grey thumb with a transparent track. Standard
     properties cover Chromium/Gecko, the ::-webkit-* rules older WebKit.
     Arrow buttons are removed in both panes. */
  .cats::-webkit-scrollbar{width:9px;height:9px}
  .cats::-webkit-scrollbar-track{background:transparent}
  .cats::-webkit-scrollbar-thumb{
    background:rgba(150,175,205,.40);border-radius:999px;
    border:3px solid transparent;background-clip:padding-box;
  }
  .cats::-webkit-scrollbar-thumb:hover{
    background:rgba(150,195,240,.62);background-clip:padding-box;
  }
  .cats::-webkit-scrollbar-button{display:none;width:0;height:0}
  .cats::-webkit-scrollbar-corner{background:transparent}

  .list::-webkit-scrollbar{width:9px;height:9px}
  .list::-webkit-scrollbar-track{background:transparent}
  .list::-webkit-scrollbar-thumb{
    background:rgba(64,111,140,.42);border-radius:999px;
    border:3px solid transparent;background-clip:padding-box;
  }
  .list::-webkit-scrollbar-thumb:hover{
    background:rgba(64,111,140,.62);background-clip:padding-box;
  }
  .list::-webkit-scrollbar-button{display:none;width:0;height:0}
  .list::-webkit-scrollbar-corner{background:transparent}
  /* Current-category summary: a section label + a count pill — never the row style. */
  .list-head{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:2px 6px 8px;margin-bottom:4px;border-bottom:1px solid rgba(89,136,166,.2);
  }
  .list-head h3{
    margin:0;min-width:0;flex:1;font-size:9.5px;line-height:1.3;font-weight:600;
    letter-spacing:.16em;text-transform:uppercase;color:#405b70;
    overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
  }
  .list-head .n{
    flex:0 0 auto;padding:1px 6px;border:1px solid rgba(74,139,164,.24);border-radius:999px;
    background:linear-gradient(120deg,#d9eaf6,#d6ecee);box-shadow:inset 0 1px rgba(255,255,255,.65);
    font-size:10px;font-weight:600;color:#315b73;font-variant-numeric:tabular-nums;
  }
  .rows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px}
  .rows>li+li{border-top:1px solid rgba(75,112,141,.14)}
  .row{
    display:flex;align-items:flex-start;gap:10px;width:100%;
    padding:6px 8px;border:1px solid transparent;border-radius:7px;text-align:left;
    transition:background-color .12s ease,border-color .12s ease,box-shadow .12s ease;
  }
  .row:hover{
    background:linear-gradient(105deg,rgba(240,247,251,.7),rgba(205,233,240,.45));
    border-color:rgba(89,151,183,.24);box-shadow:inset 2px 0 rgba(72,154,181,.65),0 2px 7px rgba(46,89,122,.04);
  }
  .row:active{background:#d7e9f1;border-color:#9dbfce;box-shadow:inset 2px 0 #4d9eb6}
  .list .row:focus-visible{outline-color:#286a95}
  .row .col{display:flex;min-width:0;flex:1;flex-direction:column;gap:1px}
  .row .t{
    font-size:13.5px;line-height:1.35;font-weight:500;color:#17324a;
    overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  }
  .row .c{font-family:var(--mono);font-size:10.5px;color:#405b70;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .p{flex:0 0 auto;min-width:34px;text-align:right;font-size:10.5px;color:#405b70;font-variant-numeric:tabular-nums}
  .empty{margin:0;padding:30px 0;text-align:center;font-size:12px;color:#64748b}
  .list .empty{color:#405b70}

  @media (prefers-reduced-motion: reduce){
    .dialog .cat,.dialog .row,.dialog .search input{transition:none}
  }

  /* ---------------------------------------------------------------- narrow */
  @media (max-width:1000px){
    .dlg-body{grid-template-columns:214px minmax(0,1fr)}
    .stage{padding:14px 20px 20px}
  }
  @media (max-width:820px){
    .rail{flex-basis:206px;width:206px}
    .stage{padding:12px 16px 18px}
    .dlg-body{grid-template-columns:196px minmax(0,1fr)}
  }
  @media (max-width:700px){
    .dialog{width:calc(100vw - 16px);height:calc(100vh - 16px);max-height:none}
    .dlg-body{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
    .cats{
      display:flex;gap:6px;align-items:center;overflow-x:auto;overflow-y:hidden;
      border-right:0;border-bottom:1px solid var(--line);padding:8px;
    }
    .cats h4{flex:0 0 auto;padding:0 2px}
    .cat-group{flex:0 0 auto;flex-direction:row;gap:4px;padding-bottom:0}
    .cat{width:auto;white-space:nowrap;padding:4px 8px}
    .cat .n{width:auto;min-width:0}
    .list{padding:8px 10px 12px}
  }
  @media (max-width:520px){
    .rail{flex-basis:152px;width:152px;padding:6px}
    .rail-btn{height:32px;gap:7px;padding:0 8px;font-size:12.5px}
    .rail-empty{padding:4px 8px;font-size:10.5px}
    .stage{padding:10px 12px 14px}
    .lede{font-size:12.5px}
    .dlg-head{padding:12px 12px 10px}
    .dlg-title .count{border-left:0;padding-left:0}
  }
</style>
</head>
<body>

<div class="shell">
  <div class="workspace">

/* Site topics, in site order, without the untranslated 法例与条例 row. */
var TOPICS = [ [ "bamboo-structure", "Bamboo structures" ], [ "timber-structure", "Timber structures" ], [ "scaffold-safety", "Scaffolding and site safety" ], [ "test-methods", "Test methods" ], [ "concrete", "Concrete" ], [ "steel", "Steel structures" ], [ "glass", "Glass" ], [ "connections", "Connections and fasteners" ], [ "fire", "Fire" ], [ "load-wind", "Loads and wind" ], [ "foundation", "Foundations" ], [ "durability", "Durability" ], [ "construction", "Construction, inspection and supervision" ], [ "precast", "Precast elements" ]
];

var TOTAL_TITLES = 879;
var TOTAL_PAGES = "9,484";
var LAYERS = [
  { id: "all", label: "All" },
  { id: "code", label: "Codes" },
  { id: "notice", label: "Notices" }
];

var state = { layer: "all", cat: null, q: "" };

function inLayer() {
  if (state.layer === "all") return DATA;
  return DATA.filter(function (d) { return d[3] === state.layer; });
}

function topicCounts() {
  var m = Object.create(null);
  inLayer().forEach(function (d) {
    d[4].forEach(function (t) { m[t] = (m[t] || 0) + 1; });
  });
  return m;
}

function topicRows() {
  var counts = topicCounts();
  return [{ id: null, label: "All titles", count: inLayer().length }].concat(
    TOPICS.map(function (t) { return { id: t[0], label: t[1], count: counts[t[0]] || 0 }; })
  );
}

function currentRows() {
  var list = inLayer();
  if (state.cat) {
    list = list.filter(function (d) { return d[4].indexOf(state.cat) >= 0; });
  }
  var needle = state.q.trim().toLowerCase();
  if (needle) {
    list = list.filter(function (d) {
      return d[0].toLowerCase().indexOf(needle) >= 0 || d[1].toLowerCase().indexOf(needle) >= 0;
    });
  }
  return list;
}

function catLabel() {
  if (!state.cat) return "All titles";
  for (var i = 0; i < TOPICS.length; i++) if (TOPICS[i][0] === state.cat) return TOPICS[i][1];
  return "All titles";
}

function listLabel() {
  var label = catLabel();
  if (state.layer === "all") return label;
  for (var i = 0; i < LAYERS.length; i++) {
    if (LAYERS[i].id === state.layer) return label + " - " + LAYERS[i].label;
  }
  return label;
}

/* ---------------------------------------------------------------- left column */
function renderCats() {
  var frag = document.createDocumentFragment();

  var layerHead = document.createElement("h4");
  layerHead.textContent = "Category";
  frag.appendChild(layerHead);

  var layerGroup = document.createElement("div");
  layerGroup.className = "cat-group";
  LAYERS.forEach(function (l) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "cat" + (state.layer === l.id ? " is-sel" : "");
    b.setAttribute("data-layer", l.id);
    b.setAttribute("aria-pressed", state.layer === l.id ? "true" : "false");
    var name = document.createElement("span");
    name.textContent = l.label;
    var n = document.createElement("span");
    n.className = "n";
    n.textContent = l.id === "all" ? String(TOTAL_TITLES) : String(l.id === "code" ? 42 : 837);
    b.appendChild(name); b.appendChild(n);
    b.addEventListener("click", function () { selectLayer(l.id); });
    layerGroup.appendChild(b);
  });
  frag.appendChild(layerGroup);

  var topicsHead = document.createElement("h4");
  topicsHead.textContent = "Topics";
  frag.appendChild(topicsHead);

  var topicGroup = document.createElement("div");
  topicGroup.className = "cat-group";
  topicRows().forEach(function (r) {
    var selected = (r.id === state.cat);
    var b = document.createElement("button");
    b.type = "button";
    b.className = "cat" + (selected ? " is-sel is-bar" : "");
    b.setAttribute("data-topic", r.id === null ? "all" : r.id);
    if (selected) b.setAttribute("aria-current", "true");
    var name = document.createElement("span");
    name.textContent = r.label;
    name.title = r.label;
    var n = document.createElement("span");
    n.className = "n";
    n.textContent = String(r.count);
    b.appendChild(name); b.appendChild(n);
    b.addEventListener("click", function () { selectCat(r.id); });
    topicGroup.appendChild(b);
  });
  frag.appendChild(topicGroup);

  var nav = document.getElementById("cats");
  nav.textContent = "";
  nav.appendChild(frag);
  syncTopicScope();
}

/* ---------------------------------------------------------------- right column */
function renderRows() {
  var list = currentRows();
  var heading = document.getElementById("cat-name");
  heading.textContent = listLabel();
  heading.title = listLabel();
  document.getElementById("cat-count").textContent = String(list.length);

  var ul = document.getElementById("rows");
  var frag = document.createDocumentFragment();
  list.forEach(function (d) {
    var li = document.createElement("li");
    var b = document.createElement("button");
    b.type = "button";
    b.className = "row";
    b.setAttribute("data-code", d[1]);

    var col = document.createElement("span");
    col.className = "col";
    var t = document.createElement("span");
    t.className = "t";
    t.textContent = d[0];
    t.title = d[0];
    var c = document.createElement("span");
    c.className = "c";
    c.textContent = d[1];
    c.title = d[1];
    col.appendChild(t); col.appendChild(c);

    var p = document.createElement("span");
    p.className = "p";
    p.textContent = String(d[2]);

    b.appendChild(col); b.appendChild(p);
    li.appendChild(b);
    frag.appendChild(li);
  });
  ul.textContent = "";
  ul.appendChild(frag);
  document.getElementById("empty").hidden = list.length > 0;
}

function selectLayer(id) {
  if (state.layer === id) return;
  state.layer = id;
  document.getElementById("list").scrollTop = 0;
  renderCats();
  renderRows();
}

function selectCat(id) {
  state.cat = id;
  document.getElementById("list").scrollTop = 0;
  renderCats();
  renderRows();
}

/* ---------------------------------------------------------------- dialog */
var dialog = document.getElementById("library");
var scrim = document.getElementById("scrim");
var openBtn = document.getElementById("open-library");

function openLibrary(focusFilter) {
  closeTitlePicker(false);
  dialog.hidden = false;
  scrim.hidden = false;
  openBtn.setAttribute("aria-expanded", "true");
  openBtn.classList.add("is-active");
  document.body.classList.add("library-open");
  if (focusFilter) {
    var f = document.getElementById("filter");
    f.focus();
    f.select();
  }
}

function closeLibrary() {
  dialog.hidden = true;
  scrim.hidden = true;
  openBtn.setAttribute("aria-expanded", "false");
  openBtn.classList.add("is-active");
  document.body.classList.remove("library-open");
  openBtn.focus();
}

openBtn.addEventListener("click", function () { openLibrary(false); });
document.getElementById("close-library").addEventListener("click", closeLibrary);
scrim.addEventListener("click", closeLibrary);
document.addEventListener("keydown", function (e) {
  if (e.key === "Escape" && !dialog.hidden) closeLibrary();
});

document.getElementById("filter").addEventListener("input", function (e) {
  state.q = e.target.value;
  renderRows();
});

/* ---------------------------------------------------------------- composer */
var scopeBtn = document.getElementById("scope-all");
var titlePicker = document.getElementById("title-picker");
var titleFilter = document.getElementById("title-filter");
var titleOptions = document.getElementById("title-options");
var titleButtons = [];

function syncTopicScope() {
  var label = catLabel();
  document.getElementById("scope-label").textContent = label;
  scopeBtn.title = label;
  scopeBtn.setAttribute("data-scope-topic", state.cat || "all");
  var rows = topicRows();
  titleButtons.forEach(function (b, i) {
    b.setAttribute("aria-selected", rows[i].id === state.cat ? "true" : "false");
    b.querySelector(".n").textContent = String(rows[i].count);
  });
}

function chooseTopic(id) {
  selectCat(id);
  closeTitlePicker(true);
}

function prepareTopics() {
  var frag = document.createDocumentFragment();
  topicRows().forEach(function (r) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "title-option";
    b.setAttribute("role", "option");
    b.setAttribute("aria-selected", r.id === state.cat ? "true" : "false");
    b.tabIndex = -1;
    b.dataset.search = r.label.toLowerCase();
    b.dataset.scopeTopic = r.id || "all";
    var check = document.createElement("span");
    check.className = "check";
    check.setAttribute("aria-hidden", "true");
    check.textContent = "✓";
    var col = document.createElement("span");
    col.className = "col";
    col.textContent = r.label;
    var count = document.createElement("span");
    count.className = "n";
    count.textContent = String(r.count);
    b.appendChild(check); b.appendChild(col); b.appendChild(count);
    b.addEventListener("click", function () { chooseTopic(r.id); });
    titleButtons.push(b);
    frag.appendChild(b);
  });
  titleOptions.appendChild(frag);
}

function positionTitlePicker() {
  if (titlePicker.hidden) return;
  var r = scopeBtn.getBoundingClientRect();
  var below = window.innerHeight - r.bottom - 12;
  var above = r.top - 12;
  var useBelow = below >= Math.min(300, above);
  titlePicker.style.maxHeight = Math.max(80, Math.min(360, useBelow ? below : above)) + "px";
  titlePicker.style.left = Math.max(12, Math.min(r.left, window.innerWidth - titlePicker.offsetWidth - 12)) + "px";
  titlePicker.style.top = (useBelow ? r.bottom + 6 : r.top - titlePicker.offsetHeight - 6) + "px";
}

function closeTitlePicker(restoreFocus) {
  if (!titlePicker) return;
  titlePicker.hidden = true;
  scopeBtn.setAttribute("aria-expanded", "false");
  if (restoreFocus) scopeBtn.focus();
}

function filterTopics() {
  var needle = titleFilter.value.trim().toLowerCase();
  var count = 0;
  titleButtons.forEach(function (b) {
    b.hidden = b.dataset.search.indexOf(needle) < 0;
    if (!b.hidden) count++;
  });
  document.getElementById("title-empty").hidden = count > 0;
  titleOptions.scrollTop = 0;
  positionTitlePicker();
}

scopeBtn.addEventListener("click", function () {
  if (!titlePicker.hidden) { closeTitlePicker(false); return; }
  titleFilter.value = "";
  titlePicker.hidden = false;
  scopeBtn.setAttribute("aria-expanded", "true");
  filterTopics();
  titleFilter.focus();
  var selected = titleButtons.filter(function (b) { return b.getAttribute("aria-selected") === "true"; })[0];
  titleOptions.scrollTop = selected.offsetTop - titleOptions.offsetTop;
});
titleFilter.addEventListener("input", filterTopics);
titlePicker.addEventListener("keydown", function (e) {
  if (e.key === "Escape") { e.preventDefault(); closeTitlePicker(true); return; }
  if (e.key === "Tab") { closeTitlePicker(true); return; }
  if (["ArrowDown", "ArrowUp", "Home", "End"].indexOf(e.key) < 0) return;
  if (e.target === titleFilter && (e.key === "Home" || e.key === "End")) return;
  var visible = titleButtons.filter(function (b) { return !b.hidden; });
  if (!visible.length) return;
  e.preventDefault();
  var at = visible.indexOf(document.activeElement);
  var next = e.key === "Home" ? 0 : e.key === "End" ? visible.length - 1 :
    at < 0 ? (e.key === "ArrowDown" ? 0 : visible.length - 1) :
    (at + (e.key === "ArrowDown" ? 1 : -1) + visible.length) % visible.length;
  visible[next].focus();
});
document.addEventListener("click", function (e) {
  if (!titlePicker.contains(e.target) && !scopeBtn.contains(e.target)) closeTitlePicker(false);
});
window.addEventListener("resize", positionTitlePicker);

var ask = document.getElementById("ask");
Array.prototype.forEach.call(document.querySelectorAll("[data-suggestion]"), function (chip) {
  chip.addEventListener("click", function () {
    ask.value = chip.textContent;
    ask.focus();
  });
});
document.getElementById("composer").addEventListener("submit", function (e) {
  e.preventDefault();
  ask.focus();
});

/* ---------------------------------------------------------------- boot */
prepareTopics();
renderCats();
renderRows();
openLibrary(false);
