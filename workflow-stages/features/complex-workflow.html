<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Project workflow — SIDA showcase</title>
<meta name="description" content="A SIDA-style construction project workflow: RIBA Plan of Work 2020 stages with Hong Kong statutory approval and consent gates.">
<link rel="stylesheet" href="flow-assets/flow.css?v=20261106-layout">
<style>
  :root {
    --ink: #e9eff6;
    --muted: #8a9bad;
    --dim: #6c7f95;
    --surface: #0b1622;
    --line: #22384c;
    --accent: #7fa8ff;
    --run: #96bdff;
    --ok: #6ee0aa;
    --warn: #f3bd72;
    --idle: #a7b3c2;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #080f18; }
  body {
    color: var(--ink);
    font: 400 14px/1.45 ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  button { font: inherit; color: inherit; }

  .flow-window {
    position: relative;
    display: flex;
    flex-direction: column;
    height: 100%;
    min-height: 420px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    box-shadow:
      0 24px 60px rgba(3, 8, 16, 0.55),
      inset 0 1px rgba(255, 255, 255, 0.04);
  }

  /* The canvas runs edge to edge; sources stay reachable from a floating chip. */
  .about-trigger {
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 25;
    display: grid;
    place-items: center;
    width: 26px;
    height: 26px;
    padding: 0;
    border: 1px solid rgba(150, 175, 210, 0.2);
    border-radius: 999px;
    background: rgba(10, 21, 34, 0.82);
    color: #b9c9dc;
    cursor: pointer;
    transition: background-color 0.14s ease, border-color 0.14s ease, color 0.14s ease;
  }

  .about-trigger:hover {
    border-color: rgba(150, 175, 210, 0.38);
    background: rgba(20, 38, 58, 0.92);
    color: var(--ink);
  }

  .about-trigger:active { background: rgba(28, 50, 74, 0.95); }
  .about-trigger:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .about-trigger svg { flex: none; }

  .flow-canvas {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    overflow: hidden;
  }

  #feature-flow-root { position: absolute; inset: 0; }

  .flow-fallback {
    display: grid;
    height: 100%;
    place-items: center;
    padding: 24px;
    color: var(--muted);
    font-size: 12px;
    text-align: center;
  }

  @media (max-width: 720px) {
    .about-trigger { top: 8px; right: 8px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
    }
  }
</style>
</head>
<body>
<div class="flow-window sida-feature-flow" role="region" aria-label="Construction project workflow">
  <div class="flow-canvas" id="flow-canvas">
    <div id="feature-flow-root" data-sida-feature-flow aria-label="Interactive SIDA construction project workflow"></div>
    <button class="about-trigger" type="button" data-about-trigger aria-label="Open scenario and sources" title="Scenario &amp; sources">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <circle cx="12" cy="12" r="9"></circle>
        <path d="M12 11v5M12 8h.01"></path>
      </svg>
    </button>
    <noscript>
      <p class="flow-fallback">This workflow is interactive and needs JavaScript.</p>
    </noscript>
  </div>
</div>

<script defer src="flow-assets/flow.js?v=20261106-layout"></script>
</body>
</html>
