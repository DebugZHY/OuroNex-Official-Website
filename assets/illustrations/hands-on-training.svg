<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <rect width="800" height="450" fill="#0d1623"/>

  <!-- Large screen/monitor showing an application -->
  <rect x="120" y="60" width="560" height="300" rx="4" stroke="rgba(155,181,210,.4)" stroke-width="1.5" fill="none"/>
  <!-- Screen header bar -->
  <line x1="120" y1="100" x2="680" y2="100" stroke="rgba(155,181,210,.35)" stroke-width="1"/>
  <circle cx="140" cy="80" r="4" stroke="rgba(155,181,210,.35)" stroke-width="1" fill="none"/>
  <circle cx="158" cy="80" r="4" stroke="rgba(155,181,210,.35)" stroke-width="1" fill="none"/>
  <circle cx="176" cy="80" r="4" stroke="rgba(155,181,210,.35)" stroke-width="1" fill="none"/>

  <!-- Screen content: document being actively worked on -->
  <line x1="160" y1="130" x2="620" y2="130" stroke="rgba(155,181,210,.35)" stroke-width="1"/>
  <line x1="160" y1="160" x2="580" y2="160" stroke="rgba(155,181,210,.35)" stroke-width="1"/>
  <line x1="160" y1="190" x2="640" y2="190" stroke="rgba(155,181,210,.35)" stroke-width="1"/>
  <line x1="160" y1="220" x2="540" y2="220" stroke="rgba(155,181,210,.35)" stroke-width="1"/>
  <line x1="160" y1="250" x2="620" y2="250" stroke="rgba(155,181,210,.35)" stroke-width="1"/>
  <!-- Active line with cursor (person is typing this) -->
  <line x1="160" y1="280" x2="420" y2="280" stroke="#729eff" stroke-width="1.5"/>
  <line x1="424" y1="270" x2="424" y2="290" stroke="#729eff" stroke-width="2"/>
  <line x1="160" y1="310" x2="480" y2="310" stroke="rgba(155,181,210,.35)" stroke-width="1"/>

  <!-- AI suggestion panel (right side of screen) -->
  <rect x="540" y="130" width="120" height="60" rx="3" stroke="#729eff" stroke-width="1" fill="none" stroke-dasharray="4,3"/>
  <line x1="555" y1="150" x2="645" y2="150" stroke="rgba(155,181,210,.4)" stroke-width="1"/>
  <line x1="555" y1="165" x2="630" y2="165" stroke="rgba(155,181,210,.4)" stroke-width="1"/>
  <text x="555" y="142" fill="#729eff" font-family="monospace" font-size="11">AI suggests</text>

  <!-- Person figure (right side, facing the screen) -->
  <circle cx="730" cy="200" r="20" stroke="rgba(155,181,210,.4)" stroke-width="1.5" fill="none"/>
  <line x1="730" y1="220" x2="730" y2="310" stroke="rgba(155,181,210,.4)" stroke-width="1.5"/>
  <line x1="730" y1="245" x2="695" y2="275" stroke="rgba(155,181,210,.4)" stroke-width="1.5"/>
  <line x1="730" y1="245" x2="700" y2="240" stroke="rgba(155,181,210,.4)" stroke-width="1.5"/>
  <line x1="730" y1="310" x2="712" y2="370" stroke="rgba(155,181,210,.4)" stroke-width="1.5"/>
  <line x1="730" y1="310" x2="748" y2="370" stroke="rgba(155,181,210,.4)" stroke-width="1.5"/>
  <!-- Arm reaching toward screen -->
  <line x1="700" y1="240" x2="660" y2="220" stroke="#729eff" stroke-width="1.5"/>

  <!-- Arrow from AI suggests to active line -->
  <line x1="560" y1="190" x2="430" y2="275" stroke="#729eff" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Keyboard at bottom (with key grid) -->
  <rect x="200" y="380" width="260" height="36" rx="3" stroke="rgba(155,181,210,.35)" stroke-width="1" fill="none"/>
  <line x1="220" y1="390" x2="440" y2="390" stroke="rgba(155,181,210,.35)" stroke-width="1"/>
  <line x1="220" y1="398" x2="440" y2="398" stroke="rgba(155,181,210,.35)" stroke-width="1"/>
  <line x1="220" y1="406" x2="440" y2="406" stroke="rgba(155,181,210,.35)" stroke-width="1"/>
  <line x1="240" y1="380" x2="240" y2="416" stroke="rgba(155,181,210,.35)" stroke-width="1"/>
  <line x1="260" y1="380" x2="260" y2="416" stroke="rgba(155,181,210,.35)" stroke-width="1"/>
  <line x1="280" y1="380" x2="280" y2="416" stroke="rgba(155,181,210,.35)" stroke-width="1"/>
  <line x1="300" y1="380" x2="300" y2="416" stroke="rgba(155,181,210,.35)" stroke-width="1"/>
  <line x1="320" y1="380" x2="320" y2="416" stroke="rgba(155,181,210,.35)" stroke-width="1"/>
  <line x1="340" y1="380" x2="340" y2="416" stroke="rgba(155,181,210,.35)" stroke-width="1"/>
  <line x1="360" y1="380" x2="360" y2="416" stroke="rgba(155,181,210,.35)" stroke-width="1"/>
  <line x1="380" y1="380" x2="380" y2="416" stroke="rgba(155,181,210,.35)" stroke-width="1"/>
  <line x1="400" y1="380" x2="400" y2="416" stroke="rgba(155,181,210,.35)" stroke-width="1"/>
  <line x1="420" y1="380" x2="420" y2="416" stroke="rgba(155,181,210,.35)" stroke-width="1"/>
  <!-- Spacebar -->
  <rect x="280" y="409" width="120" height="5" rx="1" stroke="rgba(155,181,210,.35)" stroke-width="1" fill="none"/>

  <!-- Labels -->
  <text x="120" y="35" fill="#9aabc0" font-family="monospace" font-size="12">training on your real workflow</text>
  <text x="660" y="400" fill="#9aabc0" font-family="monospace" font-size="12">your team member</text>
</svg>
