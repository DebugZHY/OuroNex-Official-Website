<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title data-i18n="account-register.create-account-ouronex.985101">Create account — OuroNex</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #0a0f1a; color: #e2e8f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 40px; width: 100%; max-width: 420px; }
    h1 { font-size: 24px; font-weight: 600; margin-bottom: 8px; color: #f8fafc; }
    .sub { color: #94a3b8; font-size: 14px; margin-bottom: 24px; }
    label { display: block; font-size: 13px; font-weight: 500; color: #cbd5e1; margin-bottom: 6px; }
    input { width: 100%; padding: 10px 12px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #f1f5f9; font-size: 14px; margin-bottom: 16px; }
    input:focus { outline: none; border-color: #3b82f6; }
    button { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    .error { background: #7f1d1d; color: #fecaca; padding: 10px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; }
    .link { text-align: center; margin-top: 16px; font-size: 13px; color: #94a3b8; }
    .link a { color: #3b82f6; text-decoration: none; }
    .link a:hover { text-decoration: underline; }
    .captcha-row { display: flex; gap: 12px; align-items: center; }
    .captcha-row input { flex: 1; }
    .captcha-q { background: #1e293b; padding: 10px 16px; border-radius: 8px; font-size: 16px; font-weight: 600; color: #f8fafc; white-space: nowrap; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  </style>
<link href="/assets/i18n.css" rel="stylesheet"/><script defer="" src="/assets/i18n/shared.js"></script><script defer="" src="/assets/i18n/dynamic.js"></script><script defer="" src="/assets/i18n/account-register.js"></script><script defer="" src="/assets/i18n.js"></script></head>
<body data-i18n-page="account-register"><div aria-label="Language / 語言 / 语言" class="language-switcher language-switcher--standalone" data-no-i18n="" role="group"><button aria-label="繁體中文" aria-pressed="false" data-lang="zh-TW" type="button">繁</button><button aria-label="简体中文" aria-pressed="false" data-lang="zh-CN" type="button">简</button><button aria-label="English" aria-pressed="true" data-lang="en" type="button">EN</button></div>
<div class="card">
<h1><span data-i18n="account-register.create-account.aaf374">Create account</span></h1>
<p class="sub"><span data-i18n="account-register.join-ouronex.c2c4d2">Join OuroNex</span></p>
    {% if messages %}
      {% for message in messages %}
        <div class="error" data-i18n-dynamic>{{ message }}</div>
      {% endfor %}
    {% endif %}
    <form method="post">
{% csrf_token %}
<label for="username"><span data-i18n="account-register.username.84c290">Username</span></label>
<input autofocus="" id="username" name="username" required="" type="text"/>
<div class="row">
<div>
<label for="email"><span data-i18n="account-register.email.84add5">Email</span></label>
<input id="email" name="email" type="email"/>
</div>
<div>
<label for="phone"><span data-i18n="account-register.phone.77064d">Phone</span></label>
<input id="phone" name="phone" type="tel"/>
</div>
</div>
<label for="password"><span data-i18n="account-register.password.8be3c9">Password</span></label>
<input id="password" name="password" required="" type="password"/>
<label for="password2"><span data-i18n="account-register.confirm-password.4a7c56">Confirm password</span></label>
<input id="password2" name="password2" required="" type="password"/>
<label><span data-i18n="account-register.verification-code.80f2f2">Verification code</span></label>
<div class="captcha-row">
<div class="captcha-q">{{ captcha_question }}</div>
<input data-i18n-placeholder="account-register.answer.a16a4e" name="captcha" placeholder="Answer" required="" type="text"/>
</div>
<button style="margin-top: 20px;" type="submit"><span data-i18n="account-register.create-account.aaf374">Create account</span></button>
</form>
<p class="link"><span data-i18n="account-register.already-have-an-account.855903">Already have an account?</span> <a href="/login/"><span data-i18n="account-register.sign-in.ada2e9">Sign in</span></a></p>
</div>
</body>
</html>
