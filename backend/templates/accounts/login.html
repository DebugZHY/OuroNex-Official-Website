<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in — OuroNex</title>
  <link rel="icon" href="/assets/ouronex-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/site.css">
  <script src="/assets/site.js" defer></script>
  <style>
    .card, .card * { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; }
    .auth-main { min-height: calc(100vh - var(--header-height)); display: flex; align-items: center; justify-content: center; padding: 48px 24px; }
    .card { background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 40px; width: 100%; max-width: 400px; }
    .card h1 { font-size: 24px; font-weight: 600; margin-bottom: 8px; color: #f8fafc; }
    .sub { color: #94a3b8; font-size: 14px; margin-bottom: 24px; }
    label { display: block; font-size: 13px; font-weight: 500; color: #cbd5e1; margin-bottom: 6px; }
    input { width: 100%; padding: 10px 12px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #f1f5f9; font-size: 14px; margin-bottom: 16px; }
    input:focus { outline: none; border-color: #3b82f6; }
    .card button { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .card button:hover { background: #1d4ed8; }
    .error { background: #7f1d1d; color: #fecaca; padding: 10px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; }
    .link { text-align: center; margin-top: 16px; font-size: 13px; color: #94a3b8; }
    .link a { color: #3b82f6; text-decoration: none; }
    .link a:hover { text-decoration: underline; }
    @media (max-width: 760px) { .auth-main { padding: 32px 20px; } .card { padding: 28px; } }
  </style>
</head>
<body data-page="login">
<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header">
  <div class="nav-shell">
    <a class="brand" href="/index.html" aria-label="OuroNex home"><img src="/assets/ouronex-mark.svg" alt="" width="60" height="36"><span>OuroNex</span></a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Open navigation"><span></span><span></span></button>
    <nav class="desktop-nav" id="site-nav" aria-label="Main navigation">
      <div class="nav-primary">
        <a href="/news.html">News</a>
        <a href="/platform.html">SIDA</a>
        <a href="/pricing.html">Price</a>
        <a href="/business.html">Business</a>
        <a href="/about-us.html">About</a>
      </div>
      <div class="nav-secondary">
        <a class="nav-contact" href="/contact.html">Contact us</a>
        <a href="/login/" data-signin aria-current="page">Log in</a>
      </div>
    </nav>
  </div>
  <div class="reading-progress" aria-hidden="true"></div>
</header>
<main class="auth-main" id="main">
  <div class="card">
    <h1>Log in</h1>
    <p class="sub">Access your OuroNex dashboard</p>
    {% if messages %}
      {% for message in messages %}
        <div class="error">{{ message }}</div>
      {% endfor %}
    {% endif %}
    <form method="post">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" required autofocus>
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required>
      <button type="submit">Log in</button>
    </form>
    <p class="link">No account? <a href="/register/">Create one</a></p>
  </div>
</main>
</body>
</html>
