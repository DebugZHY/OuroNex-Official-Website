services:
  postgres:
    image: postgres:16
    container_name: ouronex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ouronex
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ouronex"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [ouronex]

  clickhouse:
    image: clickhouse/clickhouse-server:25.10
    container_name: ouronex-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_USER: stackframe
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    mem_limit: 2g
    networks: [ouronex]

  stack-auth:
    image: stackauth/server:latest
    container_name: ouronex-stack-auth
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_started
    env_file: stack-auth.env
    ports:
      - "8101:8101"
      - "8102:8102"
    networks: [ouronex]

volumes:
  pgdata:

networks:
  ouronex:
