server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/ouronex/public;
    index index.html;
    charset utf-8;
    autoindex off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml;

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location = /assets/gate.js {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:css|js|woff2?|png|jpe?g|webp|svg|ico|glb|gz|webmanifest)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location = /404.html {
        internal;
    }

    error_page 404 /404.html;
}
